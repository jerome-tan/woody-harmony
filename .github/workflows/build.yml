name: Electron reference build

# The native Qt workflow owns push/PR validation and tag releases on this branch.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            arch: arm64
            installer: dist/*-mac-arm64.dmg
            portable: dist/*-mac-arm64-portable.zip
          - os: macos-15-intel
            platform: mac
            arch: x64
            installer: dist/*-mac-x64.dmg
            portable: dist/*-mac-x64-portable.zip
          - os: windows-2022
            platform: win
            arch: x64
            installer: dist/*-win-x64-setup.exe
            portable: dist/*-win-x64-portable.zip
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e 'const expected = "v" + require("./package.json").version; if (process.env.GITHUB_REF_NAME !== expected) throw new Error(`Tag ${process.env.GITHUB_REF_NAME} does not match ${expected}`)'

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Check Windows title bars and menus
        if: matrix.platform == 'win'
        env:
          WOODY_CHROME_QA_DIR: ${{ runner.temp }}/woody-window-chrome
        run: npm run test:window-chrome

      - name: Upload window chrome checks
        if: always() && matrix.platform == 'win'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: window-chrome-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/woody-window-chrome/evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Package installers and portable apps
        run: npx --no-install electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never

      - name: Verify Windows portable ZIP and launch
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          ./scripts/verifyWindowsPortable.ps1 -ArchivePath "dist/Woody-$version-win-${{ matrix.arch }}-portable.zip" -UnpackedPath dist/win-unpacked

      - name: Verify packages and report sizes
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const version = require('./package.json').version
          const prefix = `Woody-${version}-${process.env.BUILD_PLATFORM}-${process.env.BUILD_ARCH}`
          const names = process.env.BUILD_PLATFORM === 'mac'
            ? [`${prefix}.dmg`, `${prefix}-portable.zip`]
            : [`${prefix}-setup.exe`, `${prefix}-portable.zip`]
          const rows = names.map(name => {
            const stat = fs.statSync(`dist/${name}`)
            if (!stat.isFile() || stat.size === 0) throw new Error(`Missing or empty package: ${name}`)
            console.log(`${name}: ${stat.size} bytes (${(stat.size / 1e6).toFixed(2)} MB)`)
            return `| ${name} | ${stat.size} | ${(stat.size / 1e6).toFixed(2)} |`
          })
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `### Package sizes\n\n| File | Bytes | MB |\n| --- | ---: | ---: |\n${rows.join('\n')}\n`)
          NODE

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: woody-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ matrix.installer }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload portable app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: woody-${{ matrix.platform }}-${{ matrix.arch }}-portable
          path: ${{ matrix.portable }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

