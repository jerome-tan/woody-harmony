name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            arch: arm64
            installer: dist/*-mac-arm64.dmg
            portable: dist/*-mac-arm64-portable.zip
          - os: macos-15-intel
            platform: mac
            arch: x64
            installer: dist/*-mac-x64.dmg
            portable: dist/*-mac-x64-portable.zip
          - os: windows-2022
            platform: win
            arch: x64
            installer: dist/*-win-x64-setup.exe
            portable: dist/*-win-x64-portable.exe
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e 'const expected = "v" + require("./package.json").version; if (process.env.GITHUB_REF_NAME !== expected) throw new Error(`Tag ${process.env.GITHUB_REF_NAME} does not match ${expected}`)'

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Check Windows title bars and menus
        if: matrix.platform == 'win'
        env:
          WOODY_CHROME_QA_DIR: ${{ runner.temp }}/woody-window-chrome
        run: npm run test:window-chrome

      - name: Upload window chrome checks
        if: always() && matrix.platform == 'win'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: window-chrome-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/woody-window-chrome/evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Package installers and portable apps
        run: npx --no-install electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never

      - name: Verify packages and report sizes
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const version = require('./package.json').version
          const prefix = `Woody-${version}-${process.env.BUILD_PLATFORM}-${process.env.BUILD_ARCH}`
          const names = process.env.BUILD_PLATFORM === 'mac'
            ? [`${prefix}.dmg`, `${prefix}-portable.zip`]
            : [`${prefix}-setup.exe`, `${prefix}-portable.exe`]
          const rows = names.map(name => {
            const stat = fs.statSync(`dist/${name}`)
            if (!stat.isFile() || stat.size === 0) throw new Error(`Missing or empty package: ${name}`)
            console.log(`${name}: ${stat.size} bytes (${(stat.size / 1e6).toFixed(2)} MB)`)
            return `| ${name} | ${stat.size} | ${(stat.size / 1e6).toFixed(2)} |`
          })
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `### Package sizes\n\n| File | Bytes | MB |\n| --- | ---: | ---: |\n${rows.join('\n')}\n`)
          NODE

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: woody-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ matrix.installer }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload portable app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: woody-${{ matrix.platform }}-${{ matrix.arch }}-portable
          path: ${{ matrix.portable }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download installers and portable apps
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: woody-*
          path: dist
          merge-multiple: true

      - name: Verify packages and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cd dist
          assets=(
            "Woody-${version}-mac-arm64.dmg"
            "Woody-${version}-mac-arm64-portable.zip"
            "Woody-${version}-mac-x64.dmg"
            "Woody-${version}-mac-x64-portable.zip"
            "Woody-${version}-win-x64-setup.exe"
            "Woody-${version}-win-x64-portable.exe"
          )
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Publish complete release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-is-draft"; then
            if [ "$(cat "$RUNNER_TEMP/release-is-draft")" != 'true' ]; then
              echo "Release $tag is already published; refusing to overwrite its assets."
              exit 1
            fi
          else
            notes=".github/release-notes/${tag}.md"
            if [ -f "$notes" ]; then
              gh release create "$tag" --verify-tag --draft --title "Woody $tag" --notes-file "$notes"
            else
              gh release create "$tag" --verify-tag --draft --title "Woody $tag" --generate-notes
            fi
          fi
          gh release upload "$tag" dist/*.dmg dist/*.zip dist/*.exe dist/SHA256SUMS.txt --clobber
          gh release edit "$tag" --draft=false --latest
