name: Native Qt build and validation

on:
  push:
    branches: [main, 'codex/qt-*']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qt-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  native:
    name: Qt 6.12.0 ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            arch: arm64
            cmake_arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
            cmake_arch: x86_64
          - os: windows-2022
            platform: win
            arch: x64
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python -c 'import json,os; expected="v"+json.load(open("package.json",encoding="utf-8"))["version"]; assert os.environ["GITHUB_REF_NAME"]==expected, "Tag must match package.json version: "+expected'
      - name: Install pinned official Qt SDK
        run: python qt/scripts/install-qt.py --output "$RUNNER_TEMP/qt-sdk"
      - name: Configure macOS
        if: matrix.platform == 'mac'
        run: cmake -S . -B dist/qt-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT" -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_arch }} -DCMAKE_OSX_DEPLOYMENT_TARGET=14.4
      - name: Configure Windows
        if: matrix.platform == 'win'
        run: cmake -S . -B dist/qt-build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$QT_ROOT"
      - name: Build native application and tests
        run: cmake --build dist/qt-build --config Release --parallel 4
      - name: Test parser, report compatibility, and hdc lifecycle
        run: ctest --test-dir dist/qt-build -C Release --output-on-failure
      - name: Create shared deterministic reports
        run: python qt/scripts/generate-fixtures.py dist/qt-fixtures --benchmark
      - name: Validate native macOS UI and live capture
        if: matrix.platform == 'mac'
        run: python qt/scripts/ui-smoke.py --exe dist/qt-build/qt/Woody.app/Contents/MacOS/Woody --hdc dist/qt-build/qt/woody_fake_hdc --output dist/qt-evidence/built --fixtures dist/qt-fixtures
      - name: Validate native Windows UI and live capture
        if: matrix.platform == 'win'
        run: python qt/scripts/ui-smoke.py --exe dist/qt-build/qt/Release/Woody.exe --hdc dist/qt-build/qt/Release/woody_fake_hdc.exe --output dist/qt-evidence/built --fixtures dist/qt-fixtures
      - name: Install NSIS if needed
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }
      - name: Build installer and directory ZIP; measure actual sizes
        run: python qt/scripts/package.py --build dist/qt-build --qt "$QT_ROOT" --output dist/qt-package --arch ${{ matrix.arch }}
      - name: Validate deployed macOS app
        if: matrix.platform == 'mac'
        run: python qt/scripts/ui-smoke.py --exe dist/qt-package/staging/Woody.app/Contents/MacOS/Woody --output dist/qt-evidence/deployed --fixtures dist/qt-fixtures
      - name: Extract Windows ZIP into Unicode path
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $archive = Get-ChildItem dist/qt-package/*-portable.zip | Select-Object -First 1
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath 'dist/Qt 免安装测试' -Force
      - name: Validate extracted Windows portable app
        if: matrix.platform == 'win'
        run: python qt/scripts/ui-smoke.py --exe "dist/Qt 免安装测试/Woody/Woody.exe" --output dist/qt-evidence/portable --fixtures dist/qt-fixtures
      - name: Verify Windows installer and uninstaller
        if: matrix.platform == 'win'
        run: python qt/scripts/verify-install.py --package dist/qt-package --fixtures dist/qt-fixtures --output dist/qt-evidence/installed
      - name: Set up Electron reference toolchain
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Build unchanged Electron reference and install measurement dependency
        run: |
          npm ci
          node node_modules/electron/install.js
          npm run build
          python -m pip install psutil==7.1.3
      - name: Compare macOS startup, memory and interaction CPU
        if: matrix.platform == 'mac'
        run: python qt/scripts/benchmark.py --qt-exe dist/qt-package/staging/Woody.app/Contents/MacOS/Woody --electron-exe node_modules/electron/dist/Electron.app/Contents/MacOS/Electron --fixtures dist/qt-fixtures --output dist/qt-evidence/performance --runs 3
      - name: Compare Windows startup, memory and interaction CPU
        if: matrix.platform == 'win'
        run: python qt/scripts/benchmark.py --qt-exe "dist/Qt 免安装测试/Woody/Woody.exe" --electron-exe node_modules/electron/dist/electron.exe --fixtures dist/qt-fixtures --output dist/qt-evidence/performance --runs 3
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: woody-qt-package-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/qt-package/*-portable.zip
            dist/qt-package/*-setup.exe
            dist/qt-package/*.dmg
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: woody-qt-evidence-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/qt-package/package-sizes.json
            dist/qt-evidence/
            dist/qt-build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download installers and portable apps
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: woody-qt-package-*
          path: dist
          merge-multiple: true

      - name: Verify packages and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cd dist
          assets=(
            "Woody-${version}-qt-mac-arm64.dmg"
            "Woody-${version}-qt-mac-arm64-portable.zip"
            "Woody-${version}-qt-mac-x64.dmg"
            "Woody-${version}-qt-mac-x64-portable.zip"
            "Woody-${version}-qt-win-x64-setup.exe"
            "Woody-${version}-qt-win-x64-portable.zip"
          )
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Publish complete release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-is-draft"; then
            if [ "$(cat "$RUNNER_TEMP/release-is-draft")" != 'true' ]; then
              echo "Release $tag is already published; refusing to overwrite its assets."
              exit 1
            fi
          else
            notes=".github/release-notes/${tag}.md"
            if [ -f "$notes" ]; then
              gh release create "$tag" --verify-tag --draft --title "Woody $tag" --notes-file "$notes"
            else
              gh release create "$tag" --verify-tag --draft --title "Woody $tag" --generate-notes
            fi
          fi
          gh release upload "$tag" dist/*.dmg dist/*.zip dist/*.exe dist/SHA256SUMS.txt --clobber
          gh release edit "$tag" --draft=false --latest
